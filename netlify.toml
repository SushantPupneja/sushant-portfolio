[build]
  publish   = "portfolio"
  functions = "portfolio/netlify/functions"

# ── Clean URL rewrites ──
[[redirects]]
  from = "/projects"
  to   = "/projects.html"
  status = 200

[[redirects]]
  from = "/skills"
  to   = "/skills.html"
  status = 200

[[redirects]]
  from = "/chat"
  to   = "/chat.html"
  status = 200

# ── Catch-all 404 ──
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.anthropic.com /.netlify/functions/"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
